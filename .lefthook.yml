commit-msg:
  commands:
    cog:
      run: cog verify --file {1}

pre-commit:
  parallel: true
  commands:
    format:
      glob: "*.{js,ts,tsx,jsx,json}"
      run: bun run format

pre-push:
  commands:
    cog:
      # Validate commits since the last release tag, not all history: bare
      # `cog check` audits from the first commit, so any pre-tag non-conventional
      # commit (e.g. an old merge commit) would block every release push.
      run: cog check --from-latest-tag
    lint:
      run: bun run lint
    manifest:
      # Release lockstep guard: marketplace.json plugin versions must equal
      # apps/cli/package.json. Enforces pre-push the same gate CI's builder
      # test enforces post-push, so a desynced release commit (marketplace
      # bumped ahead of apps/cli) can no longer reach origin red.
      run: bun scripts/builder.ts check-publish-manifest apps/cli/package.json
