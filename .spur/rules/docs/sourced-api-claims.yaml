# Sourced-claims rules (docs corpus) — API/library claims in markdown must be
# verifiable. A bare version string or a time-anchored API claim ("deprecated
# since", "added in 0.5.x") on a line with no citation anchor is an unverifiable
# claim: readers cannot tell measured fact from model memory.
#
# The scan verifies three halves: the claim trigger, a citation anchor on the
# same line, and a *document-level* confidence declaration. The declaration is
# `Confidence: HIGH|MEDIUM|LOW` in prose (`**Confidence:**` and a `## Confidence`
# heading with the level following are accepted), or a frontmatter
# `confidence: <LEVEL>` field — the form the CLI-managed corpus can carry,
# since `spur feature update` writes fields and canonical sections, not
# arbitrary prose. It is document-level because the sibling enforcement point
# (`ah_guard.ts hasConfidenceLevel`) reads the whole response: a per-line rule
# would force retrospective confidence labels onto historical claims nobody
# re-verified, which is manufactured evidence rather than verification.
#
# Absorbed from `~/.config/spur/rules/docs/sourced-api-claims.yaml` (user layer)
# so the gate is self-contained. WHY: `extends: docs` resolves to ZERO rules —
# silently, with no validation error — on any machine whose user layer lacks the
# file, which would make this backstop a false green in CI (verified: a preset
# extending a nonexistent category validates `valid: true, ruleCount: 0`).
#
# The scan lives in `scripts/builder.ts check-sourced-claims`, not in a rule-file
# regex, because a per-line pattern cannot see block state. The absorbed pattern
# claimed fenced code was "out of regex reach" and it was not, so the first run
# over this corpus produced 74 findings of which 36 were false positives:
#   17  YAML frontmatter `version:` metadata (the field the doc contract mandates)
#   15  fenced code — manifest excerpts and command examples
#    4+ lines already carrying a `pkg@version` anchor, which the pattern's
#       lookahead did not accept even though sp-source-driven-development names
#       that form as a citation
# The command owns the defect classes; see `claimScanMask`, `findUncitedClaims`
# and `releaseVersions` there, and `scripts/tests/builder.test.ts` for the
# labelled baseline / residual-proof cases.
#
# Severity is `warning`, not `info`: `test-pre-check` runs `--fail-on warning`,
# so an `info` rule reports breaches while the gate still exits 0 — a finding no
# run can ever fail on. A rule that reports but cannot fail is decoration.
include:
  - "docs/**/*.md"
  - "plugins/**/SKILL.md"
  - "plugins/*/agents/*.md"
  - "plugins/**/skills/**/references/**/*.md"
rules:
  - id: cited-version-strings
    description: >
      A markdown line asserting a version string (x.y.z) with no citation anchor
      on the same line — an http(s) URL, a repo `path:line`, or the `pkg@version`
      form — is unverifiable. Add the anchor, or drop the version if it is not
      load-bearing. The document must also declare its confidence level
      (`Confidence: HIGH|MEDIUM|LOW` in prose, or a frontmatter `confidence:`
      field); the claim contract's confidence arm is enforced here, not just
      described. See sp-source-driven-development.
    severity: warning
    evaluator:
      type: exit-code
      config:
        command: bun
        args:
          - scripts/builder.ts
          - check-sourced-claims
          - version
  - id: cited-api-claims
    description: >
      A markdown line making a time- or version-anchored external API claim
      ("deprecated since 1.2", "introduced in v3", "available since 0.9") must
      carry a citation anchor on the same line, and the document must declare its
      confidence level (`Confidence: HIGH|MEDIUM|LOW` in prose, or a frontmatter
      `confidence:` field). Add the source (URL, path:line, or `pkg@version`)
      and the declaration; contract in sp-source-driven-development.
    severity: warning
    evaluator:
      type: exit-code
      config:
        command: bun
        args:
          - scripts/builder.ts
          - check-sourced-claims
          - api
