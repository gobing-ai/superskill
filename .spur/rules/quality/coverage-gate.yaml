# Coverage gate — per-file line coverage meets threshold from Bun's lcov output.
# Formerly blocked: Bun 1.3.14 did not generate lcov files with
# --coverage-reporter=lcov. The 1.4.3 pin resolves that — `bun test --coverage
# --coverage-reporter=lcov` writes .coverage/lcov.info, and this rule reads it
# (verified 2026-10-13: removing the lcov makes the rule fail with "No lcov file
# found", restoring it passes).
rules:
  - id: coverage-gate
    description: "Per-file line coverage meets 70% threshold (read from lcov)"
    severity: error
    enabled: true
    evaluator:
      type: coverage-gate
      config:
        lcovPath: .coverage/lcov.info
        threshold: 70
        include:
          - "apps/**/src/**"
          - "packages/**/src/**"
        exclude:
          - "**/node_modules/**"
          - "**/vendors/**"
          - "**/dist/**"
          - "**/tests/**"
          - "**/stubs/**"
