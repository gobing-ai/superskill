# Spur project configuration for superskill
# Generated by `spur init`; upgraded 2026-07-16 to the spur-new layout (executors,
# default-by-phase, tasks section). See docs/99_PROJECT_CONSTITUTION.md for doc SSOT.

$schema: "@gobing-ai/spur/schemas/spur-config.schema.json"
version: "1"
name: superskill

# ── Portable bootstrap (consumed by @gobing-ai/ts-infra runNodeApplication) ──
# Shared across spur and (future) spur-server. Keys map 1:1 to ts-infra's
# LoggingOptions / TelemetryOptions / database / SchedulerOptions.
bootstrap:
  logging:
    enabled: true
    level: debug
    console: false
    json: false
    file: true
    filePath: .spur/logs/spur.log
  telemetry:
    enabled: false
    serviceName: spur
    environment: development
  database:
    enabled: true
    driver: bun-sqlite
    url: .spur/spur.db
  scheduler:
    enabled: false

# ── Spur app section (validated by a local zod schema — UNCHANGED keys) ──
agent:
  default: pi
  executors:
    # Order within a tier is the stage router's preference order.
    - name: minimax
      agent: omp
      model: minimax/MiniMax-M3
      tier: cheap
    - name: omp-xf
      agent: omp
      model: astron-code-latest
      tier: standard
    - name: omp
      agent: omp
      tier: standard
    - name: pi
      agent: pi
      tier: standard
    - name: pi-xf
      agent: pi
      model: astron-code-latest
      tier: standard
    - name: grok
      agent: grok
      tier: capable
    - name: codex
      agent: codex
      tier: capable
    - name: claude
      agent: claude
      tier: capable
    - name: omp-zai
      agent: omp
      model: zai/glm-5.2
      tier: capable
    - name: omp-zai-volc
      agent: omp
      model: volc/glm-5.2
      tier: capable
    - name: omp-deepseek
      agent: omp
      model: deepseek/deepseek-v4-pro
      tier: capable
  # Compatibility only: these phases do not have canonical stages in Spur 0.3.23.
  default-by-phase:
    dev-fixall: omp-xf
    dev-runall: omp-xf
    dev-gitmsg: minimax

rules:
  paths:
    - .spur/rules/**/*.yaml

workflows:
  paths:
    - .spur/workflows/

redaction:
  enabled: false

# ── Tasks configuration (design §9 — absorbed from docs/.tasks/config.jsonc) ──
tasks:
  active: docs/tasks
  folders:
    docs/tasks:
      baseCounter: 0
      label: Primary
